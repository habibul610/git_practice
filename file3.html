<!DOCTYPE html>
<html>
<body>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="greet()">Submit</button>
    <p id="output"></p>

    <script>
        function greet() {
            const name = document.getElementById('nameInput').value;
            document.getElementById('output').innerText = "Hello, " + name + "!";
        }
    </script>
</body>
</html>
